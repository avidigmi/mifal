name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  mifal:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mifal's own tests under the system Python and the current python3
        run: /bin/bash tests/run.sh -q
  windows-copilot:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Native Windows lifecycle and installed synthetic workflow gates
        run: python -X utf8 -B -m unittest discover -s tests -p "test_windows_*.py" -v
  solo-tools-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: POSIX regular-file guards and installed synthetic workflow gates
        run: python -B -m unittest discover -s tests -p "test_windows_*.py" -v
  shipped:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Every suite, including the shipped validator and adapter suites
        run: /bin/bash tests/run.sh
